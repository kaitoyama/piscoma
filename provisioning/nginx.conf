# ISUCOMA nginx 設定
# dev-environment スペック「nginx 経由のリクエスト経路」:
# すべての HTTP リクエストは nginx を経由してアプリケーションにプロキシされる。

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # --- API はすべて Go アプリへプロキシする ---
    location /api/ {
        proxy_pass http://webapp:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- 静的配信の差し込み点（改善経路 §4.11） ---
    # 商品画像・ユーザーアイコンは初期実装では DB 格納 + アプリ経由配信
    # （GET /api/products/:id/image, GET /api/users/:id/icon）だが、
    # 参加者はこれを静的ファイル化した上で nginx が直接配信するように変更してよい。
    # その場合はここに例えば以下のような location を追加する:
    #
    # location /images/ {
    #     alias /var/www/isucoma/images/;
    #     add_header ETag $upstream_http_etag;
    #     # If-None-Match による 304 応答は sendfile + etag の組み合わせで
    #     # nginx が自動的に処理する。
    # }

    location / {
        return 404;
    }
}
